<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="description" content="ファッション、スニーカー、コラボの最新ニュースを一覧で読む">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <title>Fashion News</title>
  <style>
    :root { color-scheme: light; --paper:#f6f3ed; --ink:#24231f; --muted:#716e68; --line:#ddd8ce; --accent:#aa533d; --card:#fffefa; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.55; }
    button { font:inherit; cursor:pointer; }
    a { color:inherit; }
    .wrap { width:min(100% - 32px, 1080px); margin:auto; }
    header { border-bottom:1px solid var(--line); background:var(--paper); }
    .header-inner { padding:34px 0 22px; display:flex; justify-content:space-between; align-items:end; gap:20px; }
    .eyebrow { color:var(--accent); font-size:11px; letter-spacing:.2em; font-weight:700; text-transform:uppercase; }
    h1 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(36px,6vw,70px); line-height:1; letter-spacing:-.045em; margin:8px 0 7px; font-weight:500; }
    .subtitle,.updated { color:var(--muted); font-size:13px; margin:0; }
    .updated { text-align:right; white-space:nowrap; }
    .controls { display:flex; align-items:center; gap:10px; overflow-x:auto; padding:16px 0; scrollbar-width:thin; }
    .filter { flex:none; border:1px solid var(--line); border-radius:100px; background:transparent; padding:8px 15px; color:var(--ink); font-size:12px; font-weight:600; }
    .filter[aria-pressed="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
    .filter span { opacity:.65; margin-left:4px; }
    main { padding:24px 0 64px; }
    .section-heading { display:flex; justify-content:space-between; align-items:baseline; gap:16px; border-bottom:1px solid var(--ink); padding-bottom:10px; margin-bottom:22px; }
    h2 { font-family:Georgia,"Times New Roman",serif; font-weight:500; font-size:27px; margin:0; }
    .count { font-size:12px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
    .card { background:var(--card); border:1px solid var(--line); padding:24px; display:flex; flex-direction:column; min-height:264px; }
    .card.read { opacity:.66; }
    .meta { display:flex; flex-wrap:wrap; gap:7px 12px; align-items:center; font-size:11px; color:var(--muted); margin-bottom:19px; }
    .source { color:var(--accent); font-weight:800; letter-spacing:.025em; }
    .category { border:1px solid var(--line); border-radius:100px; padding:2px 8px; }
    .headline { font-size:clamp(17px,2vw,21px); line-height:1.5; margin:0 0 15px; font-weight:700; }
    .headline a { text-decoration:none; }
    .headline a:hover { color:var(--accent); text-decoration:underline; text-underline-offset:3px; }
    .summary-label { color:var(--accent); font-size:10px; font-weight:700; letter-spacing:.08em; margin:0 0 5px; }
    .summary { font-size:13px; color:#4e4b46; margin-bottom:18px; }
    .summary ul { margin:0; padding-left:18px; }
    .summary li+li { margin-top:5px; }
    .summary p { margin:0; color:var(--muted); }
    .footer { border-top:1px solid var(--line); padding-top:15px; margin-top:auto; display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; }
    .original { color:var(--accent); text-decoration:none; font-weight:700; }
    .original:hover { text-decoration:underline; }
    .read-button { background:transparent; border:0; color:var(--muted); padding:3px 0; }
    .empty { grid-column:1/-1; padding:56px 10px; text-align:center; color:var(--muted); border:1px solid var(--line); }
    .notice { color:var(--muted); font-size:12px; margin:28px 0 0; }
    @media(max-width:680px) { .header-inner { padding-top:26px; display:block; } .updated { text-align:left; margin-top:16px; } .grid { grid-template-columns:1fr; gap:12px; } .card { min-height:0; padding:20px; } main { padding-top:16px; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="header-inner">
        <div><div class="eyebrow">Daily Edit / Style &amp; Culture</div><h1>Fashion News</h1><p class="subtitle">気になるファッションニュースを、まとめてチェック。</p></div>
        <p class="updated">更新 <time id="updated-at"></time></p>
      </div>
      <nav class="controls" id="filters" aria-label="記事の絞り込み"></nav>
    </div>
  </header>
  <main class="wrap">
    <div class="section-heading"><h2 id="section-title">新着記事</h2><span class="count" id="article-count"></span></div>
    <div class="grid" id="articles" aria-live="polite"></div>
    <p class="notice">記事の説明は配信元のRSS抜粋です。正確な発売日や価格は元記事でご確認ください。</p>
  </main>
  <script id="news-data" type="application/json">__NEWS_DATA__</script>
  <script>
    const data = JSON.parse(document.getElementById('news-data').textContent);
    const articles = data.articles || [];
    const categories = data.categories || [];
    const storageKey = 'fashion_news_read_ids_v1';
    let readIds;
    try { readIds = new Set(JSON.parse(localStorage.getItem(storageKey) || '[]')); } catch { readIds = new Set(); }
    let filter = 'all';
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[char]);
    function saveRead() { try { localStorage.setItem(storageKey, JSON.stringify([...readIds])); } catch {} }
    function setRead(id, isRead) { isRead ? readIds.add(id) : readIds.delete(id); saveRead(); render(); }
    function matching(a) { if (filter === 'top') return a.isTop10; if (filter === 'unread') return !readIds.has(a.id); if (filter === 'read') return readIds.has(a.id); if (filter.startsWith('cat:')) return a.category === filter.slice(4); return true; }
    function renderFilters() {
      const options = [['all','すべて'],['top','新着10件'],['unread','未読'],['read','既読'],...categories.map(cat => ['cat:'+cat,cat])];
      const container = document.getElementById('filters');
      container.replaceChildren(...options.map(([id,label]) => {
        const button = document.createElement('button');
        button.className = 'filter'; button.type = 'button'; button.setAttribute('aria-pressed', String(filter === id));
        const count = articles.filter(a => id === 'all' || (id === 'top' ? a.isTop10 : id === 'unread' ? !readIds.has(a.id) : id === 'read' ? readIds.has(a.id) : a.category === id.slice(4))).length;
        button.textContent = `${label}  ${count}`;
        button.addEventListener('click', () => { filter = id; render(); });
        return button;
      }));
      document.getElementById('section-title').textContent = options.find(option => option[0] === filter)?.[1] || '新着記事';
    }
    function render() {
      renderFilters();
      const shown = articles.filter(matching);
      document.getElementById('article-count').textContent = `${shown.length}件`;
      const container = document.getElementById('articles');
      if (!shown.length) { container.innerHTML = '<p class="empty">表示できる記事がありません。ニュース取得後に再読み込みしてください。</p>'; return; }
      container.innerHTML = shown.map(a => {
        const summary = `<p>${a.snippet ? escapeHtml(a.snippet.slice(0, 120)) : '内容は元記事で確認できます。'}</p>`;
        return `<article class="card ${readIds.has(a.id) ? 'read' : ''}">
          <div class="meta"><span class="source">${escapeHtml(a.sourceName)}</span><span class="category">${escapeHtml(a.category)}</span><time>${escapeHtml(a.pubDate)}</time></div>
          <h3 class="headline"><a href="${escapeHtml(a.link)}" target="_blank" rel="noopener noreferrer" data-open="${escapeHtml(a.id)}">${escapeHtml(a.title)}</a></h3>
          <div class="summary-label">RSS抜粋</div><div class="summary">${summary}</div>
          <div class="footer"><a class="original" href="${escapeHtml(a.link)}" target="_blank" rel="noopener noreferrer" data-open="${escapeHtml(a.id)}">元記事を読む ↗</a><button class="read-button" type="button" data-read="${escapeHtml(a.id)}">${readIds.has(a.id) ? '✓ 既読' : '○ 未読'}</button></div>
        </article>`;
      }).join('');
      container.querySelectorAll('[data-open]').forEach(link => link.addEventListener('click', () => setRead(link.dataset.open, true)));
      container.querySelectorAll('[data-read]').forEach(button => button.addEventListener('click', () => setRead(button.dataset.read, !readIds.has(button.dataset.read))));
    }
    document.getElementById('updated-at').textContent = data.updatedAt || '未更新';
    render();
  </script>
</body>
</html>
